<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4f86" />
      <stop offset="50%" stop-color="#9b51e0" />
      <stop offset="100%" stop-color="#4ff0ff" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6a4bff" />
      <stop offset="60%" stop-color="#ff4f86" />
      <stop offset="100%" stop-color="#4ff0ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark container background with neon border -->
  <rect width="64" height="64" rx="16" fill="#090519" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="url(#neonGrad)" stroke-width="1.8" opacity="0.65" />

  <!-- Acoustic soundwave / frequency bars -->
  <g filter="url(#glow)">
    <!-- Wave bars with rounded caps -->
    <rect x="11" y="26" width="4.5" height="12" rx="2.25" fill="url(#barGrad)" opacity="0.75" />
    <rect x="19" y="18" width="4.5" height="28" rx="2.25" fill="url(#barGrad)" opacity="0.9" />
    <rect x="27" y="10" width="4.5" height="44" rx="2.25" fill="url(#barGrad)" />
    <rect x="35" y="16" width="4.5" height="32" rx="2.25" fill="url(#barGrad)" />
    <rect x="43" y="22" width="4.5" height="20" rx="2.25" fill="url(#barGrad)" opacity="0.9" />
    <rect x="51" y="28" width="4.5" height="8" rx="2.25" fill="url(#barGrad)" opacity="0.75" />
  </g>

  <!-- Subtle pulse dots -->
  <circle cx="29.25" cy="8" r="1.5" fill="#4ff0ff" />
  <circle cx="21.25" cy="15" r="1.2" fill="#ff4f86" />
</svg>
